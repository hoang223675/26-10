<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, birds = [];
let startTime = performance.now();

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  createBirds();
}

function createBirds() {
  birds = [];
  const total = Math.min(180, Math.max(80, Math.floor(W * H / 6000)));

  for (let i = 0; i < total; i++) {
    const left = Math.random() < 0.5;

    // Mục tiêu tạo thành hình chim lớn ở giữa
    const nx = Math.random() * 2 - 1;
    const ny = Math.random() * 1.4 - 0.7;

    // Dáng chim cách điệu: thân, đầu, cánh và đuôi
    const body =
      ((nx - 0.08) / 0.58) ** 2 +
      ((ny - 0.08) / 0.22) ** 2 < 1;

    const head =
      ((nx - 0.57) / 0.19) ** 2 +
      ((ny + 0.01) / 0.18) ** 2 < 1;

    const wing =
      nx > -0.5 && nx < 0.42 &&
      ny < 0.05 &&
      ny > -0.72 + Math.abs(nx + 0.05) * 0.45;

    const tail =
      nx < -0.35 && nx > -0.95 &&
      Math.abs(ny) < 0.16;

    let tx = W / 2 + nx * Math.min(W * 0.38, 280);
    let ty = H / 2 + ny * Math.min(H * 0.38, 250);

    if (!(body || head || wing || tail)) {
      tx = W / 2 + (left ? -1 : 1) * Math.random() * 80;
      ty = H / 2 + (Math.random() - 0.5) * 100;
    }

    birds.push({
      x: left ? -Math.random() * W : W + Math.random() * W,
      y: Math.random() * H,
      tx, ty,
      size: 2 + Math.random() * 4,
      delay: Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.004 + Math.random() * 0.004,
      left
    });
  }
}

function drawBird(x, y, size, angle, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = size > 8 ? 18 : 2;

  ctx.beginPath();
  ctx.moveTo(-size, 0);
  ctx.quadraticCurveTo(-size * 0.5, -size, 0, -size * 0.2);
  ctx.quadraticCurveTo(size * 0.5, -size, size, 0);
  ctx.quadraticCurveTo(size * 0.4, -size * 0.3, 0, size * 0.25);
  ctx.quadraticCurveTo(-size * 0.4, -size * 0.3, -size, 0);
  ctx.fill();

  ctx.restore();
}

function animate(now) {
  const time = (now - startTime) / 1000;

  ctx.fillStyle = "rgba(0, 0, 0, 0.32)";
  ctx.fillRect(0, 0, W, H);

  // Ánh sáng xanh nhẹ ở trung tâm
  const glow = ctx.createRadialGradient(
    W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * 0.5
  );
  glow.addColorStop(0, "rgba(0, 50, 110, 0.16)");
  glow.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  birds.forEach(b => {
    const elapsed = Math.max(0, time - b.delay);
    const t = Math.min(1, elapsed * b.speed * 12);

    // Bay từ hai phía vào giữa theo đường cong
    const smooth = t * t * (3 - 2 * t);
    const x = b.x + (b.tx - b.x) * smooth;
    const y = b.y + (b.ty - b.y) * smooth
      + Math.sin(time * 2 + b.phase) * (1 - smooth) * 35;

    const angle = (1 - smooth) *
      (b.left ? 0.12 : Math.PI - 0.12);

    const size = b.size + smooth * 7;
    const color = smooth > 0.65
      ? "#159dff"
      : "#d9efff";

    drawBird(
      x, y, size, angle, color,
      0.45 + smooth * 0.55
    );
  });

  requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);
resize();
ctx.fillStyle = "#000";
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(animate);
</script>
</body>
</html>
